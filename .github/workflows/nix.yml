name: Nix

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Check formatting
        run: nix fmt -- --check flake.nix nix/package.nix
      - name: Build, run tests, and check plugin and libusb loading
        run: nix flake check -L
      - name: Check development shell
        run: nix develop -c python -m pytest -q
