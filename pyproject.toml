[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "python-can-busmust"
version = "0.1.0a1"
description = "Alpha native PyUSB BUSMUST CAN and CAN FD backend for python-can"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
dependencies = ["python-can>=4.3,<5", "pyusb>=1.2,<2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.urls]
Homepage = "https://github.com/madprogrammer/python-can-busmust"
Repository = "https://github.com/madprogrammer/python-can-busmust"
Issues = "https://github.com/madprogrammer/python-can-busmust/issues"
Documentation = "https://github.com/madprogrammer/python-can-busmust#readme"
Changelog = "https://github.com/madprogrammer/python-can-busmust/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7", "build", "can-isotp>=2,<3", "cantools>=39"]

[project.entry-points."can.interface"]
busmust = "busmust:BusMustBus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
